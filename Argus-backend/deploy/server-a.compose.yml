services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: argus-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argus_rag}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-argus_rag}"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    build:
      context: .
      dockerfile: images/elasticsearch/Dockerfile
    container_name: argus-rag-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms384m -Xmx384m}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  minio:
    # MinIO 官方已于 2025-10 停止发布 Docker 镜像（Docker Hub / quay.io 均已下架），
    # 改用社区维护的正版替代 cgr.dev/chainguard/minio。
    image: cgr.dev/chainguard/minio:latest
    container_name: argus-rag-minio
    restart: unless-stopped
    # Chainguard 镜像默认以非 root 用户(65532)运行，写 /data 会权限不足，这里用 root 运行
    user: "0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    # Chainguard 镜像不含 curl，改用 bash 的 /dev/tcp 检测 9000 端口是否在监听
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticvue:
    image: cars10/elasticvue:latest
    container_name: argus-rag-elasticvue
    restart: unless-stopped
    ports:
      - "${ELASTICVUE_PORT:-8088}:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  postgres-data:
  elasticsearch-data:
  minio-data:
